[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dream-server"
version = "0.1.0"
description = "Local GPU server for Dream Explorer — Deep Dream & Neural Style Transfer with PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "httpx>=0.27",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
dream-server = "dream_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dream_server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
